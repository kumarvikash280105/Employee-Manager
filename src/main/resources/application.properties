# EmpManage CMS & Employee Management Server Configuration
server.port=${PORT:8090}

# PostgreSQL Database Configuration with Environment Variable Support
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/empmanage_cms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Kishan@62041}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Web Resources Handling
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Security & Environment Flags
app.security.demo-accounts-enabled=${DEMO_ACCOUNTS_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090,http://127.0.0.1:8090}
